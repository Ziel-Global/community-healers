# Abuse ceiling: ~10,000 requests/hour from a single client IP. nginx only
# accepts rates in r/s or r/m (`10000r/h` is rejected at startup), so the hourly
# figure is expressed as 166r/m — 9,960/hour, deliberately rounded down rather
# than up so the configured limit never exceeds the mandated one.
#
# Keyed on $binary_remote_addr — the connection's source address, which after
# Jazz's NAT is the real client. It can't be forged by a request header the way
# X-Forwarded-For can. Note this counts users sharing an IP (office/carrier NAT)
# together; 166r/m is loose enough that normal shared browsing stays well under.
#
# 1m of zone memory holds roughly 16,000 distinct IPs.
limit_req_zone $binary_remote_addr zone=perip:10m rate=166r/m;

# 429 rather than nginx's default 503: this is client-side rate limiting, and
# the frontend's axios interceptor already turns a 429 into a retry-aware
# message for the user.
limit_req_status 429;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # limit_req_status alone sends a bare 429 with no Retry-After, so route
    # rejections through a handler that adds one.
    error_page 429 = @ratelimited;

    # The SPA's own client-side routes reuse these same prefixes (e.g.
    # /ministry/review, /ministry/registry — see AppRoutes.tsx), so a
    # regex match alone can't tell a real API call from a full-page
    # navigation/refresh landing on one of those frontend routes. The
    # frontend's axios client (services/api.ts) sets X-Requested-With on
    # every real request — plain browser navigations never send it — so use
    # that to route only genuine API calls to the backend and hand
    # everything else to the SPA's index.html. Without this, refreshing
    # /ministry/review served the backend's raw JSON 404 instead of the app.
    location ~ ^/(auth|candidates|center-admin|center-onboarding|internal|ministry|super-admin|users)(/|$) {
        if ($http_x_requested_with != "XMLHttpRequest") {
            rewrite ^ /index.html last;
        }

        # Scoped to just this location (backend/API traffic) rather than the
        # whole server — it previously sat at server level and counted every
        # static asset (hashed JS/CSS chunks, images) against the same
        # budget as real API calls. A single page load can fire 50+ chunk
        # requests on its own, and normal interactive use (viewing several
        # candidate documents back to back) adds more on top — neither is
        # abuse, but both could exhaust a shared budget and start returning
        # 429s for legitimate use mid-session. Static assets cost nothing to
        # serve and carry no backend-abuse risk, so they no longer count at
        # all. burst=200 nodelay gives real interactive bursts (verify +
        # several document previews + list refreshes) headroom without
        # raising the sustained 166r/m ceiling that actually caps abuse.
        limit_req zone=perip burst=200 nodelay;

        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cookie_path / /;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Retry-After is intentionally a few seconds, not the 3600 the hourly
    # framing suggests: limit_req is a leaky bucket, so once a client is
    # rejected it drains at 166r/m and a slot frees up in well under a second.
    # Advertising an hour would strand a user who merely spiked briefly.
    location @ratelimited {
        internal;
        add_header Retry-After 5 always;
        default_type application/json;
        return 429 '{"statusCode":429,"message":"Too many requests. Please retry shortly."}';
    }
}

# HTTPS on the real domain — needed for browser camera access (getUserMedia
# requires a secure context; the bare-IP HTTP server above can't provide
# that). Cert is Let's Encrypt, renewed on the host by certbot's timer and
# mounted read-only; see docker-compose.yml for the volume and
# /etc/letsencrypt/renewal-hooks for the container restart hooks.
server {
    listen 443 ssl;
    # HTTP/1.1 caps the browser at ~6 concurrent connections per origin —
    # this SPA fires far more than that at once (dozens of hashed JS chunks,
    # candidate list/dashboard calls, document-preview fetches), so anything
    # triggered after the initial burst just queues behind earlier requests
    # until a connection frees up. That's what "the photo eventually loads,
    # just late" was — not an error, a multiplexing bottleneck. HTTP/2
    # multiplexes everything over one connection and removes the queue
    # entirely.
    http2 on;
    server_name app.worldwidebusinessesnetwork.com;

    ssl_certificate /etc/letsencrypt/live/app.worldwidebusinessesnetwork.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.worldwidebusinessesnetwork.com/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    error_page 429 = @ratelimited;

    # See the matching location block in the port-80 server above for why
    # the X-Requested-With check is here, and for why limit_req now lives on
    # this location instead of the server block (static assets no longer
    # count against the same budget as real API calls).
    location ~ ^/(auth|candidates|center-admin|center-onboarding|internal|ministry|super-admin|users)(/|$) {
        if ($http_x_requested_with != "XMLHttpRequest") {
            rewrite ^ /index.html last;
        }
        limit_req zone=perip burst=200 nodelay;
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cookie_path / /;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location @ratelimited {
        internal;
        add_header Retry-After 5 always;
        default_type application/json;
        return 429 '{"statusCode":429,"message":"Too many requests. Please retry shortly."}';
    }
}
