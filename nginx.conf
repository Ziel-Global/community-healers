# Abuse ceiling: ~10,000 requests/hour from a single client IP. nginx only
# accepts rates in r/s or r/m (`10000r/h` is rejected at startup), so the hourly
# figure is expressed as 166r/m — 9,960/hour, deliberately rounded down rather
# than up so the configured limit never exceeds the mandated one.
#
# Keyed on $binary_remote_addr — the connection's source address, which after
# Jazz's NAT is the real client. It can't be forged by a request header the way
# X-Forwarded-For can. Note this counts users sharing an IP (office/carrier NAT)
# together; 166r/m is loose enough that normal shared browsing stays well under.
#
# 1m of zone memory holds roughly 16,000 distinct IPs.
limit_req_zone $binary_remote_addr zone=perip:10m rate=166r/m;

# 429 rather than nginx's default 503: this is client-side rate limiting, and
# the frontend's axios interceptor already turns a 429 into a retry-aware
# message for the user.
limit_req_status 429;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # burst=50 nodelay: opening the app fires a page's worth of hashed Vite
    # chunks plus its first API calls within the same second. Without a burst
    # allowance those normal parallel requests would be rejected while nowhere
    # near the hourly ceiling. `nodelay` serves the burst immediately instead of
    # queueing it at 166r/m (which would make the app crawl); the requests still
    # count against the average, so sustained abuse is still cut off.
    limit_req zone=perip burst=50 nodelay;

    # limit_req_status alone sends a bare 429 with no Retry-After, so route
    # rejections through a handler that adds one.
    error_page 429 = @ratelimited;

    location ~ ^/(auth|candidates|center-admin|ministry|super-admin)(/|$) {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cookie_path / /;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Retry-After is intentionally a few seconds, not the 3600 the hourly
    # framing suggests: limit_req is a leaky bucket, so once a client is
    # rejected it drains at 166r/m and a slot frees up in well under a second.
    # Advertising an hour would strand a user who merely spiked briefly.
    location @ratelimited {
        internal;
        add_header Retry-After 5 always;
        default_type application/json;
        return 429 '{"statusCode":429,"message":"Too many requests. Please retry shortly."}';
    }
}

# HTTPS on the real domain — needed for browser camera access (getUserMedia
# requires a secure context; the bare-IP HTTP server above can't provide
# that). Cert is Let's Encrypt, renewed on the host by certbot's timer and
# mounted read-only; see docker-compose.yml for the volume and
# /etc/letsencrypt/renewal-hooks for the container restart hooks.
server {
    listen 443 ssl;
    server_name app.worldwidebusinessesnetwork.com;

    ssl_certificate /etc/letsencrypt/live/app.worldwidebusinessesnetwork.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.worldwidebusinessesnetwork.com/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    limit_req zone=perip burst=50 nodelay;
    error_page 429 = @ratelimited;

    location ~ ^/(auth|candidates|center-admin|ministry|super-admin)(/|$) {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cookie_path / /;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location @ratelimited {
        internal;
        add_header Retry-After 5 always;
        default_type application/json;
        return 429 '{"statusCode":429,"message":"Too many requests. Please retry shortly."}';
    }
}
